[project]
name = "wp-bulk-publisher"
version = "0.1.0"
description = "Validate a CSV of SEO articles and schedule them on WordPress via the REST API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.13",
    "sqlmodel>=0.0.37",
    "sqlalchemy[asyncio]>=2.0.40",
    "psycopg[binary]>=3.3",
    "pgvector>=0.4",
    "alembic>=1.16",
]

[project.optional-dependencies]
pipeline = [
    "numpy>=2.0",
    "mem0ai>=2.2",
    "openai>=1.60",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.3", "aiosqlite>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
